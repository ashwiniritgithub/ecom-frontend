name: React + Node.js CI (No Backend Tests, No MongoDB)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # Frontend
      - name: Install frontend dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Test React frontend
        run: npm test -- --watchAll=false

      # Backend install only (no test)
      - name: Install backend dependencies
        working-directory: ./store-api
        run: npm install

      # Skipped backend tests
      # - name: Test backend
      #   working-directory: ./store-api
      #   run: npm test
