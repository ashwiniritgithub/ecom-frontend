name: Fullstack CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongo --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    # Frontend steps
    - name: Install frontend dependencies
      run: npm install

    - name: Build frontend
      run: npm run build

    - name: Test frontend
      run: npm test -- --watchAll=false

    # Backend steps
    - name: Install backend dependencies
      working-directory: ./store-api
      run: npm install

    - name: Test backend
      working-directory: ./store-api
      env:
        MONGO_URL: mongodb://localhost:27017/ecom
      run: npm test
