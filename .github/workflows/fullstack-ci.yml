name: Fullstack CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:4.4  # Start MongoDB 4.4 container
        ports:
          - 27017:27017   # Expose default MongoDB port
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Build Project
      run: npm run build

    - name: Run Tests
      env:
        MONGO_URL: mongodb://localhost:27017/testdb
      run: npm test || echo "No tests yet"